image: ompcluster/hpcbase:ubuntu20.04-cuda11.2-mpich

stages:
  - build
  - test
  - test-failure

build-all-mpich:
  stage: build
  tags:
    - f1-alveo
  variables:
    CC: clang-12
    CXX: clang++-12
  script:
    - mkdir build
    - cd build
    - cmake ../llvm -DCMAKE_BUILD_TYPE="Release" -DLIBOMPTARGET_ENABLE_DEBUG=On -DLLVM_ENABLE_ASSERTIONS=On -DLLVM_ENABLE_PROJECTS="clang;openmp" -DLLVM_TARGETS_TO_BUILD="X86;NVPTX" -DLLVM_USE_LINKER=gold -DCLANG_OPENMP_NVPTX_DEFAULT_ARCH=sm_35 -DLIBOMPTARGET_NVPTX_COMPUTE_CAPABILITIES=35 -DLIBOMPTARGET_NVPTX_BC_LINKER=llvm-link-12
    - make -j$(nproc)
  artifacts:
    paths:
      - ./build

check-all-mpich:
  stage: test
  tags:
    - f1-alveo
  variables:
    LD_LIBRARY_PATH: /opt/veloc/lib/:$LD_LIBRARY_PATH
    LIBRARY_PATH: /opt/veloc/lib/:$LIBRARY_PATH
  script:
    - cd build
    - LIT_OPTS="--timeout=300" make -j$(nproc) check-all
  allow_failure: true
  dependencies:
    - build-all-mpich

test-taskbench-heft-mpich:
  stage: test
  variables:
    DEFAULT_FEATURES: 0
    USE_OMPCLUSTER: 1
    OMPCLUSTER_CP_USEVELOC: 1
    CXX: $CI_PROJECT_DIR/build/bin/clang++
    LD_LIBRARY_PATH: $CI_PROJECT_DIR/build/lib/:$CI_PROJECT_DIR/build/projects/openmp/libomptarget/:/opt/veloc/lib/:$LD_LIBRARY_PATH
    LIBRARY_PATH: $CI_PROJECT_DIR/build/lib/:$CI_PROJECT_DIR/build/projects/openmp/libomptarget/:/opt/veloc/lib/:$LIBRARY_PATH
    CPATH: $CI_PROJECT_DIR/build/projects/openmp/runtime/src:$CPATH
  script:
    - git clone --depth 1 -b tdg-no-loop https://gitlab.com/ompcluster/task-bench.git
    - cd task-bench
    - ./get_deps.sh
    - ./build_all.sh
    # Test scheduling policies
    - ./test_all.sh
    # HEFT as initial scheduling
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0 OMPCLUSTER_INITIAL_ITERATION_NUMBER=0 OMPCLUSTER_RESCHEDULING_INTERVAL=0 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0 OMPCLUSTER_INITIAL_ITERATION_NUMBER=0 OMPCLUSTER_RESCHEDULING_INTERVAL=2 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0 OMPCLUSTER_INITIAL_ITERATION_NUMBER=2 OMPCLUSTER_RESCHEDULING_INTERVAL=0 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0 OMPCLUSTER_INITIAL_ITERATION_NUMBER=2 OMPCLUSTER_RESCHEDULING_INTERVAL=2 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0 OMPCLUSTER_INITIAL_ITERATION_NUMBER=5 OMPCLUSTER_RESCHEDULING_INTERVAL=0 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0 OMPCLUSTER_INITIAL_ITERATION_NUMBER=5 OMPCLUSTER_RESCHEDULING_INTERVAL=2 SHORT_TEST=1 ./test_all.sh
  dependencies:
    - build-all-mpich

test-taskbench-rr-heft-mpich:
  stage: test
  variables:
    DEFAULT_FEATURES: 0
    USE_OMPCLUSTER: 1
    OMPCLUSTER_CP_USEVELOC: 1
    CXX: $CI_PROJECT_DIR/build/bin/clang++
    LD_LIBRARY_PATH: $CI_PROJECT_DIR/build/lib/:$CI_PROJECT_DIR/build/projects/openmp/libomptarget/:/opt/veloc/lib/:$LD_LIBRARY_PATH
    LIBRARY_PATH: $CI_PROJECT_DIR/build/lib/:$CI_PROJECT_DIR/build/projects/openmp/libomptarget/:/opt/veloc/lib/:$LIBRARY_PATH
    CPATH: $CI_PROJECT_DIR/build/projects/openmp/runtime/src:$CPATH
  script:
    - git clone --depth 1 -b tdg-no-loop https://gitlab.com/ompcluster/task-bench.git
    - cd task-bench
    - ./get_deps.sh
    - ./build_all.sh
    # Test scheduling policies
    - ./test_all.sh  
    # RR as initial scheduling
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1 OMPCLUSTER_INITIAL_ITERATION_NUMBER=0 OMPCLUSTER_RESCHEDULING_INTERVAL=0 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1 OMPCLUSTER_INITIAL_ITERATION_NUMBER=0 OMPCLUSTER_RESCHEDULING_INTERVAL=2 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1 OMPCLUSTER_INITIAL_ITERATION_NUMBER=2 OMPCLUSTER_RESCHEDULING_INTERVAL=0 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1 OMPCLUSTER_INITIAL_ITERATION_NUMBER=2 OMPCLUSTER_RESCHEDULING_INTERVAL=2 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1 OMPCLUSTER_INITIAL_ITERATION_NUMBER=5 OMPCLUSTER_RESCHEDULING_INTERVAL=0 SHORT_TEST=1 ./test_all.sh
    - OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1 OMPCLUSTER_INITIAL_ITERATION_NUMBER=5 OMPCLUSTER_RESCHEDULING_INTERVAL=2 SHORT_TEST=1 ./test_all.sh
  dependencies:
    - build-all-mpich

