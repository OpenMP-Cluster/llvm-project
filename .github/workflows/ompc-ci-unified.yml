name: OMPC Unified CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "openmp/**"
      - "offload/**"
      - "llvm/**"
      - ".github/workflows/ompc-ci-unified.yml"
      - ".github/scripts/build-gpu-coverage.sh"
      - ".github/scripts/ompc-gpu-coverage-isolation.cmake"
      - "sonar-project.properties"

permissions:
  contents: read

jobs:
  cpu:
    name: Build and test OMPC (self-hosted)
    runs-on: [self-hosted, ompc-ci]
    timeout-minutes: 240

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      LIBOMPTARGET_INFO: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch SonarQube target branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          git fetch --no-tags --unshallow origin \
            "+refs/heads/${{ github.head_ref }}:refs/remotes/origin/${{ github.head_ref }}" \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

          git merge-base \
            "origin/${{ github.head_ref }}" \
            "origin/${{ github.base_ref }}"

      - name: Bootstrap Clang
        run: /home/ompc/tools/llvm/bootstrap-clang.sh "$GITHUB_WORKSPACE"

      - name: Build OpenMP and offload runtimes
        run: /home/ompc/tools/llvm/build-runtimes.sh "$GITHUB_WORKSPACE" "$BUILD_DIR"

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Run OpenMP tests
        env:
          CHECK_OPENMP_ENV: KMP_TOPOLOGY_METHOD=cpuinfo
        run: cmake --build "$BUILD_DIR" --target check-openmp --parallel 2

      - name: Checkout TaskBench
        uses: actions/checkout@v4
        with:
          repository: OpenMP-Cluster/task-bench
          ref: ci-scheduling-tests
          path: task-bench

      - name: Build TaskBench
        env:
          OMPC_RUNTIMES_BUILD: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          export PATH="/home/ompc/tools/llvm/builds/host/release/bin:$PATH"
          export LD_LIBRARY_PATH="$BUILD_DIR/openmp/runtime/src:/home/ompc/tools/llvm/builds/host/release/lib:${LD_LIBRARY_PATH:-}"
          export LIBRARY_PATH="$BUILD_DIR/openmp/runtime/src:/home/ompc/tools/llvm/builds/host/release/lib:${LIBRARY_PATH:-}"
          make -C task-bench/core -j4 CC=clang CXX=clang++
          make -C task-bench/ompcluster -j4 CXX=clang++ CUDA=0

      - name: Run TaskBench scheduling tests
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/taskbench-results.tsv"
          printf 'Test\tStatus\tAttempts\n' > "$results"

          export PATH="/home/ompc/tools/llvm/builds/host/release/bin:$PATH"
          export LD_LIBRARY_PATH="$BUILD_DIR/openmp/runtime/src:/home/ompc/tools/llvm/builds/host/release/lib:${LD_LIBRARY_PATH:-}"

          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export UCX_TLS=self,sysv,tcp
          export OMP_TARGET_OFFLOAD=MANDATORY
          export LIBOMPTARGET_DEBUG=1

          cd task-bench

          run_test() {
            local name="$1"
            local scheduler="$2"
            local binary="$3"
            local dmdas_config="${4:-}"

            echo "=== $name ==="

            unset OMPCLUSTER_RUNTIME OMPCLUSTER_SCHEDULER
            unset OMPCLUSTER_PERF_MODEL_DIR
            unset OMPCLUSTER_PERF_MODEL_TRAINING
            unset OMPCLUSTER_PERF_SAMPLES
            unset OMPCLUSTER_DMDAS_FORCE_WORKER
            unset OMPCLUSTER_DMDAS_NON_TARGET_COST
            unset OMPCLUSTER_DMDAS_BANDWIDTH
            unset OMPCLUSTER_INITIAL_SCHEDULE_POLICY OMPCLUSTER_INITIAL_ITERATION_NUMBER
            unset OMPCLUSTER_RESCHEDULING_INTERVAL KMP_MAX_TDGS
            unset OMPCLUSTER_HEFT_LOG OMPCLUSTER_HEFT_COMM_COEF
            unset OMPCLUSTER_HEFT_COMP_COST OMPCLUSTER_HEFT_COMM_COST
            unset OMPCLUSTER_TASK_GRAPH_DUMP_PATH
            unset OMPCLUSTER_HEFT_DUMP_EDGE_LABEL OMPCLUSTER_HEFT_DUMP_PRED
            unset OMPCLUSTER_HEFT_DUMP_FAKE_ENTRY OMPCLUSTER_HEFT_DUMP_FAKE_EXIT
            unset OMPCLUSTER_INTERPOLATION_TYPE
            export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1

            if [[ "$scheduler" == "dmdas" ]]; then
              export OMPCLUSTER_RUNTIME=dmdas
            else
              export OMPCLUSTER_SCHEDULER="$scheduler"
            fi

            if [[ "$name" == "dmdas-rescheduling" ]]; then
              export OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0
              export OMPCLUSTER_INITIAL_ITERATION_NUMBER=0
              export OMPCLUSTER_RESCHEDULING_INTERVAL=2
              export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=5
              export KMP_MAX_TDGS=100
            fi

            if [[ "$name" == "heft-rr-rescheduling" ]]; then
              export OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1
              export OMPCLUSTER_INITIAL_ITERATION_NUMBER=2
              export OMPCLUSTER_RESCHEDULING_INTERVAL=1
              export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=6
              export OMPCLUSTER_INTERPOLATION_TYPE=0
            fi

            if [[ "$name" == "legacy-heft-dot-full" ]]; then
              local output="$GITHUB_WORKSPACE/heft-test"
              mkdir -p "$output"
              export OMPCLUSTER_TASK_GRAPH_DUMP_PATH="$output/graph"
              export OMPCLUSTER_HEFT_LOG="$output/heft.log"
              export OMPCLUSTER_HEFT_COMM_COEF=1.5
              export OMPCLUSTER_HEFT_COMP_COST=120
              export OMPCLUSTER_HEFT_COMM_COST=2
              export OMPCLUSTER_HEFT_DUMP_EDGE_LABEL=1
              export OMPCLUSTER_HEFT_DUMP_PRED=1
              export OMPCLUSTER_HEFT_DUMP_FAKE_ENTRY=1
              export OMPCLUSTER_HEFT_DUMP_FAKE_EXIT=1
            fi

            if [[ "$name" == "heft-log" ]]; then
              export OMPCLUSTER_HEFT_LOG="$GITHUB_WORKSPACE/heft-test/heft-modern.log"
              mkdir -p "$GITHUB_WORKSPACE/heft-test"
            fi

            if [[ -n "$dmdas_config" ]]; then
              export "$dmdas_config"
            fi

            local attempt rc
            for attempt in 1 2 3; do
              echo "=== $name: attempt $attempt/3 ==="
              rc=0
              timeout 20s mpirun \
                -np 2 llvm-offload-mpi-proxy-device \
                : -np 1 "./ompcluster/$binary" \
                -steps 4 -width 4 \
                -type trivial \
                -kernel compute_bound \
                -iter 1000 \
                > "$name-attempt-$attempt.log" 2>&1 || rc=$?

              cat "$name-attempt-$attempt.log"
              if [[ "$rc" -eq 0 ]] && grep -q 'Elapsed Time' "$name-attempt-$attempt.log"; then
                cp "$name-attempt-$attempt.log" "$name.log"
                if [[ "$attempt" -eq 1 ]]; then
                  echo "PASS: $name"
                  printf '%s\tPASS\t1\n' "$name" >> "$results"
                else
                  echo "::warning::FLAKY: $name passed on attempt $attempt/3"
                  printf '%s\tFLAKY\t%s\n' "$name" "$attempt" >> "$results"
                fi
                return 0
              fi
              echo "::warning::Test $name failed on attempt $attempt/3 (exit=$rc)"
            done

            echo "::warning::FAIL: $name failed after 3 attempts"
            printf '%s\tFAIL\t3\n' "$name" >> "$results"
            return 0
          }

          run_test dmdas-tdg dmdas main
          run_test dmdas-no-tdg dmdas main_no_datamap
          run_test dmdas-force-worker dmdas main OMPCLUSTER_DMDAS_FORCE_WORKER=0
          run_test dmdas-non-target-zero dmdas main OMPCLUSTER_DMDAS_NON_TARGET_COST=0
          run_test dmdas-zero-bandwidth dmdas main OMPCLUSTER_DMDAS_BANDWIDTH=0
          run_test dmdas-rescheduling dmdas main
          run_test roundrobin-dynamic roundrobin main
          run_test graph-roundrobin-tdg graph_roundrobin main
          run_test legacy-heft-tdg heft_legacy main
          run_test legacy-heft-dot-full heft_legacy main
          run_test legacy-heft-no-tdg heft_legacy main_no_datamap
          run_test heft-tdg heft main
          rm -f "$GITHUB_WORKSPACE/heft-test/heft-modern.log"
          run_test heft-log heft main
          if test -s "$GITHUB_WORKSPACE/heft-test/heft-modern.log" &&
             grep -q '^Dependencies$' "$GITHUB_WORKSPACE/heft-test/heft-modern.log" &&
             grep -q '^Schedule Map$' "$GITHUB_WORKSPACE/heft-test/heft-modern.log"; then
            printf 'heft-log-validation\tPASS\t1\n' >> "$results"
          else
            echo "::warning::FAIL: heft-log-validation (missing or incomplete HEFT log)"
            printf 'heft-log-validation\tFAIL\t1\n' >> "$results"
          fi
          run_test heft-rr-rescheduling heft main

      - name: Build instrumented OpenMP runtime
        run: |
          /home/ompc/tools/llvm/build-runtimes-coverage.sh \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-coverage"

      - name: Collect OpenMP tests coverage
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/coverage-data"
          export LLVM_PROFILE_FILE="$GITHUB_WORKSPACE/coverage-data/openmp-%p.profraw"
          export KMP_TOPOLOGY_METHOD=cpuinfo
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build-coverage/openmp/runtime/src:${LD_LIBRARY_PATH:-}"

          cmake --build "$GITHUB_WORKSPACE/build-coverage" --target check-openmp --parallel 2

      - name: Collect scheduler lifecycle coverage
        run: |
          set -euo pipefail

          TC=/home/ompc/tools/llvm/builds/host/release
          LIBDIR="$GITHUB_WORKSPACE/build-coverage/openmp/runtime/src"
          OUT="$GITHUB_WORKSPACE/coverage-data/scheduler-lifecycle"

          mkdir -p "$OUT"

          export LD_LIBRARY_PATH="$LIBDIR:${LD_LIBRARY_PATH:-}"

          "$TC/bin/clang++" -std=c++17 -O0 \
            "$GITHUB_WORKSPACE/tests/ompc/scheduler_lifecycle.cpp" \
            -L"$LIBDIR" -lomp \
            -Wl,-rpath,"$LIBDIR" \
            -o "$OUT/test_scheduler_lifecycle"

          for scheduler in roundrobin graph_roundrobin heft_legacy; do
            echo "=== Scheduler lifecycle: $scheduler ==="

            export OMPCLUSTER_SCHEDULER="$scheduler"
            export OMPCLUSTER_TASK_GRAPH_DUMP_PATH="$OUT/$scheduler"
            export LLVM_PROFILE_FILE="$OUT/$scheduler-%p.profraw"

            rm -f "$OUT/$scheduler-"*.profraw
            timeout 15s "$OUT/test_scheduler_lifecycle" "$scheduler"

            test -n "$(find "$OUT" -name "$scheduler-*.profraw" -print -quit)"
          done

          echo "PASS: scheduler lifecycle coverage"

      - name: Collect TaskBench coverage
        run: |
          set -euo pipefail
          coverage_results="$GITHUB_WORKSPACE/taskbench-coverage-results.tsv"
          printf 'Test\tStatus\tAttempts\n' > "$coverage_results"

          mkdir -p "$GITHUB_WORKSPACE/coverage-data"

          export PATH="/home/ompc/tools/llvm/builds/host/release/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build-coverage/openmp/runtime/src:/home/ompc/tools/llvm/builds/host/release/lib:${LD_LIBRARY_PATH:-}"

          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export UCX_TLS=self,sysv,tcp
          export OMP_TARGET_OFFLOAD=MANDATORY

          cd task-bench

          run_coverage() {
            local name="$1" scheduler="$2" binary="$3" dmdas_config="${4:-}"

            unset OMPCLUSTER_RUNTIME OMPCLUSTER_SCHEDULER
            unset OMPCLUSTER_PERF_MODEL_DIR OMPCLUSTER_PERF_MODEL_TRAINING OMPCLUSTER_PERF_SAMPLES
            unset OMPCLUSTER_DMDAS_FORCE_WORKER OMPCLUSTER_DMDAS_NON_TARGET_COST OMPCLUSTER_DMDAS_BANDWIDTH
            unset OMPCLUSTER_DMDAS_PLACEMENT_DEBUG
            unset OMPCLUSTER_INITIAL_SCHEDULE_POLICY OMPCLUSTER_INITIAL_ITERATION_NUMBER
            unset OMPCLUSTER_RESCHEDULING_INTERVAL KMP_MAX_TDGS
            unset OMPCLUSTER_HEFT_LOG OMPCLUSTER_HEFT_COMM_COEF
            unset OMPCLUSTER_HEFT_COMP_COST OMPCLUSTER_HEFT_COMM_COST
            unset OMPCLUSTER_TASK_GRAPH_DUMP_PATH
            unset OMPCLUSTER_HEFT_DUMP_EDGE_LABEL OMPCLUSTER_HEFT_DUMP_PRED
            unset OMPCLUSTER_HEFT_DUMP_FAKE_ENTRY OMPCLUSTER_HEFT_DUMP_FAKE_EXIT
            unset OMPCLUSTER_INTERPOLATION_TYPE
            export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1

            if [[ "$scheduler" == "dmdas" ]]; then
              export OMPCLUSTER_RUNTIME=dmdas
            else
              export OMPCLUSTER_SCHEDULER="$scheduler"
            fi

            export LLVM_PROFILE_FILE="$GITHUB_WORKSPACE/coverage-data/${name}-%p.profraw"

            if [[ "$name" == "dmdas-force-worker" ]]; then
              export OMPCLUSTER_DMDAS_PLACEMENT_DEBUG=1
            fi

            if [[ "$name" == "dmdas-rescheduling" ]]; then
              export OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0
              export OMPCLUSTER_INITIAL_ITERATION_NUMBER=0
              export OMPCLUSTER_RESCHEDULING_INTERVAL=2
              export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=5
              export KMP_MAX_TDGS=100
            fi

            if [[ "$name" == "heft-rr-rescheduling" ]]; then
              export OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1
              export OMPCLUSTER_INITIAL_ITERATION_NUMBER=2
              export OMPCLUSTER_RESCHEDULING_INTERVAL=1
              export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=6
              export OMPCLUSTER_INTERPOLATION_TYPE=0
            fi

            if [[ "$name" == "dmdas-perf-model" || "$name" == "dmdas-perf-model-reload" ]]; then
              export OMPCLUSTER_PERF_MODEL_DIR="$GITHUB_WORKSPACE/dmdas-perf-model"
              mkdir -p "$OMPCLUSTER_PERF_MODEL_DIR"
              export OMPCLUSTER_PERF_MODEL_TRAINING=1
              export OMPCLUSTER_PERF_SAMPLES=1
              export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=5
            fi

            if [[ "$name" == "legacy-heft-dot-full" ]]; then
              local output="$GITHUB_WORKSPACE/heft-coverage"
              mkdir -p "$output"
              export OMPCLUSTER_TASK_GRAPH_DUMP_PATH="$output/graph"
              export OMPCLUSTER_HEFT_LOG="$output/heft.log"
              export OMPCLUSTER_HEFT_COMM_COEF=1.5
              export OMPCLUSTER_HEFT_COMP_COST=120
              export OMPCLUSTER_HEFT_COMM_COST=2
              export OMPCLUSTER_HEFT_DUMP_EDGE_LABEL=1
              export OMPCLUSTER_HEFT_DUMP_PRED=1
              export OMPCLUSTER_HEFT_DUMP_FAKE_ENTRY=1
              export OMPCLUSTER_HEFT_DUMP_FAKE_EXIT=1
            fi

            if [[ "$name" == "heft-log" ]]; then
              export OMPCLUSTER_HEFT_LOG="$GITHUB_WORKSPACE/heft-coverage/heft-modern.log"
              mkdir -p "$GITHUB_WORKSPACE/heft-coverage"
            fi

            if [[ -n "$dmdas_config" ]]; then
              export "$dmdas_config"
            fi

            local attempt rc
            for attempt in 1 2 3; do
              echo "=== Coverage $name: attempt $attempt/3 ==="
              rc=0
              timeout 20s mpirun \
                -np 2 llvm-offload-mpi-proxy-device \
                : -np 1 "./ompcluster/$binary" \
                -steps 4 -width 4 -type trivial \
                -kernel compute_bound -iter 1000 \
                > "coverage-${name}-attempt-${attempt}.log" 2>&1 || rc=$?

              cat "coverage-${name}-attempt-${attempt}.log"

              if [[ "$rc" -eq 0 ]] &&
                 grep -q 'Elapsed Time' "coverage-${name}-attempt-${attempt}.log"; then
                cp "coverage-${name}-attempt-${attempt}.log" "coverage-${name}.log"
                if [[ "$attempt" -eq 1 ]]; then
                  echo "PASS: coverage $name"
                  printf '%s\tPASS\t1\n' "$name" >> "$coverage_results"
                else
                  echo "::warning::FLAKY: coverage $name passed on attempt $attempt/3"
                  printf '%s\tFLAKY\t%s\n' "$name" "$attempt" >> "$coverage_results"
                fi
                return 0
              fi
              echo "::warning::Coverage $name failed on attempt $attempt/3 (exit=$rc)"
            done

            echo "::warning::FAIL: coverage $name failed after 3 attempts"
            printf '%s\tFAIL\t3\n' "$name" >> "$coverage_results"
            return 0
          }

          run_coverage dmdas-tdg dmdas main
          run_coverage dmdas-no-tdg dmdas main_no_datamap
          run_coverage dmdas-force-worker dmdas main OMPCLUSTER_DMDAS_FORCE_WORKER=0
          run_coverage dmdas-non-target-zero dmdas main OMPCLUSTER_DMDAS_NON_TARGET_COST=0
          run_coverage dmdas-zero-bandwidth dmdas main OMPCLUSTER_DMDAS_BANDWIDTH=0
          run_coverage dmdas-rescheduling dmdas main
          rm -rf "$GITHUB_WORKSPACE/dmdas-perf-model"
          run_coverage dmdas-perf-model dmdas main
          if test -s "$GITHUB_WORKSPACE/dmdas-perf-model/perf_models.dat" &&
             test -s "$GITHUB_WORKSPACE/dmdas-perf-model/perf_samples.dat"; then
            printf 'dmdas-perf-model-validation\tPASS\t1\n' >> "$coverage_results"
          else
            echo "::warning::FAIL: DMDAS performance model files missing"
            printf 'dmdas-perf-model-validation\tFAIL\t1\n' >> "$coverage_results"
          fi

          run_coverage dmdas-perf-model-reload dmdas main
          if grep -Eq 'PERF MODEL: loaded [1-9][0-9]* entries' coverage-dmdas-perf-model-reload.log; then
            printf 'dmdas-perf-model-reload-validation\tPASS\t1\n' >> "$coverage_results"
          else
            echo "::warning::FAIL: DMDAS performance model reload validation"
            printf 'dmdas-perf-model-reload-validation\tFAIL\t1\n' >> "$coverage_results"
          fi
          run_coverage roundrobin-dynamic roundrobin main
          run_coverage graph-roundrobin-tdg graph_roundrobin main
          run_coverage legacy-heft-tdg heft_legacy main
          run_coverage legacy-heft-dot-full heft_legacy main
          run_coverage legacy-heft-no-tdg heft_legacy main_no_datamap
          run_coverage heft-tdg heft main
          rm -f "$GITHUB_WORKSPACE/heft-coverage/heft-modern.log"
          run_coverage heft-log heft main
          if test -s "$GITHUB_WORKSPACE/heft-coverage/heft-modern.log" &&
             grep -q '^Dependencies$' "$GITHUB_WORKSPACE/heft-coverage/heft-modern.log" &&
             grep -q '^Schedule Map$' "$GITHUB_WORKSPACE/heft-coverage/heft-modern.log"; then
            printf 'heft-log-validation\tPASS\t1\n' >> "$coverage_results"
          else
            echo "::warning::FAIL: HEFT coverage log missing or incomplete"
            printf 'heft-log-validation\tFAIL\t1\n' >> "$coverage_results"
          fi
          run_coverage heft-rr-rescheduling heft main

      - name: Generate LLVM coverage report
        if: success() || failure()
        run: |
          set -euo pipefail

          LLVM_BIN=/home/ompc/tools/llvm/builds/host/release/bin
          LIBOMP="$GITHUB_WORKSPACE/build-coverage/openmp/runtime/src/libomp.so"
          COVERAGE_DIR="$GITHUB_WORKSPACE/coverage-data"

          mapfile -d '' profiles < <(
            find "$COVERAGE_DIR" -type f -name '*.profraw' -print0
          )

          test "${#profiles[@]}" -gt 0

          "$LLVM_BIN/llvm-profdata" merge -sparse \
            "${profiles[@]}" \
            -o "$COVERAGE_DIR/coverage.profdata"

          "$LLVM_BIN/llvm-cov" report "$LIBOMP" \
            -instr-profile="$COVERAGE_DIR/coverage.profdata" \
            -ignore-filename-regex='(/usr/|/third-party/)' \
            > "$COVERAGE_DIR/summary.txt"

          "$LLVM_BIN/llvm-cov" show "$LIBOMP" \
            -instr-profile="$COVERAGE_DIR/coverage.profdata" \
            -format=html \
            -output-dir="$COVERAGE_DIR/html" \
            -ignore-filename-regex='(/usr/|/third-party/)'

          "$LLVM_BIN/llvm-cov" export "$LIBOMP" \
            -instr-profile="$COVERAGE_DIR/coverage.profdata" \
            -format=lcov \
            -ignore-filename-regex='(/usr/|/third-party/)' \
            > "$COVERAGE_DIR/coverage.info"

          "$LLVM_BIN/llvm-cov" show "$LIBOMP" \
            -instr-profile="$COVERAGE_DIR/coverage.profdata" \
            -format=text \
            -ignore-filename-regex='(/usr/|/third-party/)' \
            > "$COVERAGE_DIR/coverage.txt"

          cat "$COVERAGE_DIR/summary.txt"

      - name: Summarize TaskBench results
        if: always()
        run: |
          python3 - <<'PYTHON'
          import csv
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a") as out:
              out.write("## OMPC TaskBench test results\n\n")
              out.write("| Suite | Test | Status | Attempts |\n")
              out.write("|---|---|---|---|\n")

              for suite, filename in [
                  ("Scheduling", "taskbench-results.tsv"),
                  ("Coverage", "taskbench-coverage-results.tsv"),
              ]:
                  path = workspace / filename
                  if not path.exists():
                      out.write(f"| {suite} | Not executed | SKIPPED | — |\n")
                      continue

                  with path.open() as f:
                      for row in csv.DictReader(f, delimiter="\t"):
                          status = row["Status"]
                          symbol = {
                              "PASS": "✅",
                              "FLAKY": "⚠️",
                              "FAIL": "❌",
                          }.get(status, "❓")
                          out.write(
                              f"| {suite} | {row['Test']} | "
                              f"{symbol} {status} | {row['Attempts']} |\n"
                          )

              out.write("\nTests marked FLAKY passed after retries. ")
              out.write("FAIL means all attempts failed.\n")
          PYTHON

      - name: Upload LLVM coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ompc-llvm-coverage
          path: |
            coverage-data/html/
            coverage-data/summary.txt
            coverage-data/coverage.profdata
          if-no-files-found: warn

      - name: Upload TaskBench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskbench-scheduling-logs
          path: task-bench/*.log
          if-no-files-found: ignore

      - name: Upload CPU coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: ompc-cpu-coverage
          path: |
            coverage-data/coverage.profdata
            build-coverage/compile_commands.json
          if-no-files-found: error

  gpu:
    name: Build and test OMPC GPU
    runs-on: [self-hosted, ompc-ci]
    timeout-minutes: 240

    steps:
      - name: Checkout LLVM
        uses: actions/checkout@v4

      - name: Build OMPC GPU
        run: |
          set -euo pipefail
          JOBS=2 /home/ompc/tools/llvm/build-ompc-gpu.sh "$GITHUB_WORKSPACE"

      - name: Checkout TaskBench
        uses: actions/checkout@v4
        with:
          repository: OpenMP-Cluster/task-bench
          ref: ci-scheduling-tests
          path: task-bench

      - name: Build TaskBench GPU
        run: |
          set -euo pipefail

          TC=/home/ompc/tools/llvm/installs/gpu/release
          export PATH="$TC/bin:/usr/local/cuda/bin:$PATH"
          export LD_LIBRARY_PATH="$TC/lib:$TC/lib/x86_64-unknown-linux-gnu:${LD_LIBRARY_PATH:-}"
          export LIBRARY_PATH="$TC/lib:$TC/lib/x86_64-unknown-linux-gnu:${LIBRARY_PATH:-}"

          export OMPC_LLVM_INSTALL="$TC"
          export OMPC_RUNTIMES_BUILD=/home/ompc/tools/llvm/builds/gpu/runtimes
          export CUDA_HOME=/usr/local/cuda

          make -C task-bench/core -j2 CC=clang CXX=clang++

          make -C task-bench/ompcluster -j2 \
            main_gpu_auto \
            CXX=clang++ \
            CUDA=1 \
            CUDA_ARCH=sm_120

          "$TC/bin/llvm-objdump" --offloading \
            task-bench/ompcluster/main_gpu_auto \
            | tee gpu-offloading-images.txt

          grep -q 'arch *sm_120' gpu-offloading-images.txt

          echo "=== Build CPU + CUDA TaskBench for heterogeneous HEFT coverage ==="

          "$TC/bin/clang++" \
            -fopenmp \
            -fopenmp-targets=x86_64-pc-linux-gnu,nvptx64-nvidia-cuda \
            -Xopenmp-target=nvptx64-nvidia-cuda --offload-arch=sm_120 \
            -O2 \
            -I task-bench/core \
            -I "$TC/include" \
            -I "$OMPC_RUNTIMES_BUILD/openmp/runtime/src" \
            -c task-bench/ompcluster/main_gpu_auto.cc \
            -o task-bench/ompcluster/main_gpu_auto_multitarget.o

          "$TC/bin/clang++" \
            task-bench/ompcluster/main_gpu_auto_multitarget.o \
            task-bench/core/libcore_s.a \
            -L/usr/local/cuda/lib64/stubs -lcuda \
            -fopenmp \
            -fopenmp-targets=x86_64-pc-linux-gnu,nvptx64-nvidia-cuda \
            -Xopenmp-target=nvptx64-nvidia-cuda --offload-arch=sm_120 \
            -O2 \
            -o task-bench/ompcluster/main_gpu_auto_multitarget

          "$TC/bin/llvm-objdump" --offloading \
            task-bench/ompcluster/main_gpu_auto_multitarget \
            | tee gpu-multitarget-images.txt

          grep -q 'triple *x86_64-pc-linux-gnu' gpu-multitarget-images.txt
          grep -q 'triple *nvptx64-nvidia-cuda' gpu-multitarget-images.txt

      - name: Run GPU scheduling tests
        run: |
          set -euo pipefail

          TC=/home/ompc/tools/llvm/installs/gpu/release
          export PATH="$TC/bin:$PATH"
          export LD_LIBRARY_PATH="$TC/lib:$TC/lib/x86_64-unknown-linux-gnu:${LD_LIBRARY_PATH:-}"

          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_TARGET_OFFLOAD=MANDATORY
          export UCX_TLS=self,sysv,tcp
          export LIBOMPTARGET_DEBUG=1

          cd task-bench

          run_gpu_test() {
            local name="$1"
            local scheduler="$2"
            local tdg="$3"
            local log="${name}.log"
            local rc=0

            unset OMPCLUSTER_RUNTIME OMPCLUSTER_SCHEDULER
            unset OMPCLUSTER_INITIAL_SCHEDULE_POLICY
            unset OMPCLUSTER_INITIAL_ITERATION_NUMBER

            if [[ "$scheduler" == "dmdas" ]]; then
              export OMPCLUSTER_RUNTIME=dmdas
            else
              export OMPCLUSTER_SCHEDULER="$scheduler"
            fi

            export KMP_MAX_TDGS="$tdg"

            if [[ "$scheduler" == "heft" ]]; then
              export OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0
              export OMPCLUSTER_INITIAL_ITERATION_NUMBER=0
            fi

            echo "=== GPU TEST: $name ==="

            timeout 60s mpirun -l \
              -np 2 "$TC/bin/llvm-offload-mpi-proxy-device" \
              : -np 1 ./ompcluster/main_gpu_auto \
              -steps 4 -width 4 -type trivial \
              -kernel compute_bound -iter 100 \
              -output 32768 -tpblock 32 -nblocks 1 \
              > "$log" 2>&1 || rc=$?

            grep -E \
              'Total Tasks|Elapsed Time|Launching kernel|Assertion|Segmentation' \
              "$log" | tail -20 || true

            if [[ "$rc" -ne 0 ]] ||
               ! grep -q 'Total Tasks 16' "$log" ||
               ! grep -q 'Elapsed Time' "$log" ||
               ! grep -q 'Launching kernel' "$log"; then
              echo "::error::GPU test $name failed (exit=$rc)"
              tail -80 "$log"
              return 1
            fi

            echo "PASS: $name"
          }

          run_gpu_test dmdas-tdg dmdas 100
          run_gpu_test dmdas-no-tdg dmdas 0
          run_gpu_test heft-legacy-tdg heft_legacy 100
          run_gpu_test heft-legacy-no-tdg heft_legacy 0
          run_gpu_test heft-tdg heft 100

      - name: Build instrumented GPU runtime
        run: |
          set -euo pipefail
          JOBS=2 bash "$GITHUB_WORKSPACE/.github/scripts/build-gpu-coverage.sh" "$GITHUB_WORKSPACE"

      - name: Collect GPU scheduling coverage
        run: |
          set -euo pipefail

          BUILD=$GITHUB_WORKSPACE/.ompc-gpu-coverage-build
          TC=/home/ompc/tools/llvm/installs/gpu/release
          OUT="$GITHUB_WORKSPACE/gpu-coverage-data"

          mkdir -p "$OUT"

          export PATH="$BUILD/isolated/bin:$TC/bin:$PATH"
          export LD_LIBRARY_PATH="$BUILD/openmp/runtime/src:$BUILD/isolated/lib:/home/ompc/tools/llvm/builds/gpu/release/lib:$TC/lib:$TC/lib/x86_64-unknown-linux-gnu:${LD_LIBRARY_PATH:-}"

          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_TARGET_OFFLOAD=MANDATORY
          export UCX_TLS=self,sysv,tcp
          export LIBOMPTARGET_INFO=-1

          unset LIBOMPTARGET_DEBUG

          run_coverage() {
            local name="$1"
            local scheduler="$2"
            local tdg="$3"
            local dir="$OUT/$name"

            mkdir -p "$dir"

            unset OMPCLUSTER_RUNTIME OMPCLUSTER_SCHEDULER
            unset OMPCLUSTER_INITIAL_SCHEDULE_POLICY
            unset OMPCLUSTER_INITIAL_ITERATION_NUMBER

            if [[ "$scheduler" == dmdas ]]; then
              export OMPCLUSTER_RUNTIME=dmdas
            else
              export OMPCLUSTER_SCHEDULER="$scheduler"
            fi

            export KMP_MAX_TDGS="$tdg"
            export LLVM_PROFILE_FILE="$dir/gpu-%p-%m.profraw"

            if [[ "$scheduler" == heft ]]; then
              export OMPCLUSTER_INITIAL_SCHEDULE_POLICY=0
              export OMPCLUSTER_INITIAL_ITERATION_NUMBER=0
            fi

            timeout 60s mpirun -l \
              -np 2 "$BUILD/isolated/bin/llvm-offload-mpi-proxy-device" \
              : -np 1 ./task-bench/ompcluster/main_gpu_auto \
              -steps 4 -width 4 -type trivial \
              -kernel compute_bound -iter 100 \
              -output 32768 -tpblock 32 -nblocks 1 \
              > "$dir/taskbench.log" 2>&1

            grep -q 'Total Tasks 16' "$dir/taskbench.log"
            grep -q 'Elapsed Time' "$dir/taskbench.log"
            grep -q 'Launching kernel' "$dir/taskbench.log"

            echo "PASS: $name"
          }

          run_coverage dmdas-tdg dmdas 100
          run_coverage dmdas-no-tdg dmdas 0
          run_coverage heft-legacy-tdg heft_legacy 100
          run_coverage heft-legacy-no-tdg heft_legacy 0
          run_coverage heft-tdg heft 100

          # Exercise heterogeneous HEFT interpolation with CPU and CUDA targets.
          echo "=== GPU COVERAGE: heft-heterogeneous-interpolation ==="

          HEFT_DIR="$OUT/heft-heterogeneous-interpolation"
          mkdir -p "$HEFT_DIR"

          export OMPCLUSTER_SCHEDULER=heft
          unset OMPCLUSTER_RUNTIME
          export OMPCLUSTER_INITIAL_SCHEDULE_POLICY=1
          export OMPCLUSTER_INITIAL_ITERATION_NUMBER=1
          export OMPCLUSTER_RESCHEDULING_INTERVAL=1
          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=6
          export OMPCLUSTER_INTERPOLATION_TYPE=1
          export KMP_MAX_TDGS=100
          export LIBOMPTARGET_INFO=0

          RESULTS="$HEFT_DIR/results.tsv"
          printf 'Attempt\tStatus\tExitCode\tProfiles\n' > "$RESULTS"

          failures=0

          for attempt in 1 2 3 4 5; do
            dir="$HEFT_DIR/run-$attempt"
            mkdir -p "$dir"
            export LLVM_PROFILE_FILE="$dir/gpu-%p-%m.profraw"

            echo "=== HEFT heterogeneous attempt $attempt/5 ==="

            rc=0
            timeout 60s mpirun -l \
              -np 2 "$BUILD/isolated/bin/llvm-offload-mpi-proxy-device" \
              : -np 1 ./task-bench/ompcluster/main_gpu_auto_multitarget \
              -steps 4 -width 4 -type trivial \
              -kernel compute_bound -iter 100 \
              -output 32768 -tpblock 32 -nblocks 1 \
              > "$dir/taskbench.log" 2>&1 || rc=$?

            profiles=$(find "$dir" -maxdepth 1 -name '*.profraw' | wc -l)

            if [[ "$rc" -eq 0 ]] &&
               grep -q 'Total Tasks 16' "$dir/taskbench.log" &&
               grep -q 'Elapsed Time' "$dir/taskbench.log" &&
               [[ "$profiles" -gt 0 ]]; then
              status=PASS
            else
              if [[ "$rc" -eq 124 ]]; then
                status=TIMEOUT
              else
                status=FAIL
              fi

              failures=$((failures + 1))
              echo "::error::HEFT heterogeneous attempt $attempt failed (exit=$rc)"
              tail -40 "$dir/taskbench.log"

              # Do not merge profiles from failed or incomplete executions.
              find "$dir" -maxdepth 1 -name '*.profraw' -delete
            fi

            printf '%s\t%s\t%s\t%s\n' \
              "$attempt" "$status" "$rc" "$profiles" >> "$RESULTS"

            echo "HEFT attempt $attempt: $status (exit=$rc, profiles=$profiles)"
          done

          {
            echo "## GPU HEFT heterogeneous interpolation"
            echo
            echo "| Attempt | Status | Exit code | Profiles |"
            echo "|---|---|---:|---:|"

            while IFS=$'\t' read -r attempt status rc profiles; do
              [[ "$attempt" == Attempt ]] && continue

              if [[ "$status" == PASS ]]; then
                symbol="PASS"
              else
                symbol="FAIL"
              fi

              echo "| $attempt | $symbol | $rc | $profiles |"
            done < "$RESULTS"

            echo
            echo "All five attempts must pass."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "HEFT heterogeneous failures: $failures"

          mapfile -d '' profiles < <(
            find "$OUT" -name '*.profraw' -print0
          )

          test "${#profiles[@]}" -gt 0

          "$TC/bin/llvm-profdata" merge -sparse             "${profiles[@]}"             -o "$OUT/gpu.profdata"

          cp "$BUILD/openmp/runtime/src/libomp.so"             "$OUT/libomp-gpu.so"

          if [[ "$failures" -gt 0 ]]; then
            echo "::error::$failures/5 heterogeneous HEFT attempts failed"
            exit 1
          fi

      - name: Upload GPU coverage
        if: ${{ always() && hashFiles('gpu-coverage-data/gpu.profdata', 'gpu-coverage-data/libomp-gpu.so') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ompc-gpu-coverage
          path: |
            gpu-coverage-data/gpu.profdata
            gpu-coverage-data/libomp-gpu.so
          if-no-files-found: error

      - name: Upload GPU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ompc-gpu-test-logs
          path: |
            task-bench/*.log
            gpu-coverage-data/**/taskbench.log
            gpu-coverage-data/**/results.tsv
            gpu-offloading-images.txt
          if-no-files-found: warn

  sonarcloud:
    name: Combined CPU + GPU coverage
    needs: [cpu, gpu]
    runs-on: [self-hosted, ompc-ci]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CPU coverage
        uses: actions/download-artifact@v4
        with:
          name: ompc-cpu-coverage
          path: .

      - name: Download GPU coverage
        uses: actions/download-artifact@v4
        with:
          name: ompc-gpu-coverage
          path: gpu-coverage-data

      - name: Merge CPU and GPU coverage
        run: |
          set -euo pipefail

          LLVM_BIN=/home/ompc/tools/llvm/installs/gpu/release/bin
          CPU=coverage-data/coverage.profdata
          GPU=gpu-coverage-data/gpu.profdata
          LIBOMP=gpu-coverage-data/libomp-gpu.so

          echo "=== Downloaded coverage artifacts ==="
          find coverage-data gpu-coverage-data build-coverage -maxdepth 2 -type f -printf '%p %s bytes\n' 2>&1 || true

          for file in "$CPU" "$GPU" "$LIBOMP" build-coverage/compile_commands.json; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty coverage artifact: $file"
              exit 1
            fi
          done

          echo "=== Merge CPU and GPU profiles ==="

          "$LLVM_BIN/llvm-profdata" merge -sparse \
            "$CPU" "$GPU" \
            -o coverage-data/combined.profdata

          echo "=== Generate llvm-cov text report ==="
          "$LLVM_BIN/llvm-cov" show "$LIBOMP" \
            -instr-profile=coverage-data/combined.profdata \
            -format=text \
            -ignore-filename-regex='(/usr/|/third-party/)' \
            > coverage-data/coverage.txt

          echo "=== Generate llvm-cov summary ==="
          "$LLVM_BIN/llvm-cov" report "$LIBOMP" \
            -instr-profile=coverage-data/combined.profdata \
            -ignore-filename-regex='(/usr/|/third-party/)' \
            | tee coverage-data/summary-combined.txt
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ompc-combined-coverage
          path: |
            coverage-data/combined.profdata
            coverage-data/coverage.txt
            coverage-data/summary-combined.txt
          if-no-files-found: warn
